<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="الأسئلة الشائعة — Frequently Asked Questions · Doaa Gadallah" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141311" />
  <title>دعاء جادالله · الأسئلة الشائعة — FAQ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b14a22'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fffdf9' font-family='sans-serif'%3E%D8%AF%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      var l = localStorage.getItem("lang") || "ar";
      document.documentElement.lang = l;
      document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#top" aria-label="Doaa Gadallah">
        <span class="brand-mark" aria-hidden="true">د</span>
        <span class="brand-name" data-i18n="brandName"></span>
      </a>
      <div class="controls">
        <button id="langBtn" class="chip-btn" type="button" aria-label="Switch language"></button>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero shell">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 class="hero-title" data-i18n="title"></h1>
      <p class="hero-sub" data-i18n="sub"></p>

      <div class="search" role="search">
        <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" autocomplete="off" />
        <button id="clearBtn" class="clear-btn" type="button" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </section>

    <section class="shell faq-section">
      <div class="faq-count" id="faqCount" aria-live="polite"></div>
      <div id="faqList" class="faq-list"></div>
      <div id="noResults" class="no-results" hidden>
        <p data-i18n="noResults"></p>
      </div>
    </section>

    <section class="shell cta-section">
      <div class="cta-card">
        <h2 class="cta-title" data-i18n="ctaTitle"></h2>
        <p class="cta-sub" data-i18n="ctaSub"></p>
        <div class="cta-actions">
          <a id="mailBtn" class="btn btn-primary" href="mailto:doaagadallah.it2027@gmail.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span data-i18n="btnMail"></span>
          </a>
          <button id="copyBtn" class="btn btn-ghost" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            <span data-i18n="btnCopy"></span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span data-i18n="footerNote"></span>
      <a href="mailto:doaagadallah.it2027@gmail.com" dir="ltr">doaagadallah.it2027@gmail.com</a>
      <span class="copyright">© 2026 Doaa Gadallah</span>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
